[project]
name = "expense-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yaniv1223", email = "157611742+yaniv1223@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.33.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
expense-bot = "expense_bot:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
